<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(45deg, #ff6f61, #ff9c85);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            height: 100vh;
            justify-content: flex-start;
        }
        
        h1 {
            color: #fff;
            font-size: 32px;
            margin-bottom: 20px;
        }
        
        .nav {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        
        .nav a {
            margin: 0 15px;
            text-decoration: none;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
        }
        
        .nav a:hover {
            text-decoration: underline;
        }
        
        ul {
            width: 100%;
            max-width: 800px;
            list-style-type: none;
            padding: 0;
        }
        
        li {
            background: white;
            margin: 10px 0;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.3s ease-in-out;
        }
        
        li:hover {
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }
        
        .task-info {
            flex-grow: 1;
        }
        
        .task-info strong {
            color: #333;
            font-size: 18px;
        }
        
        .task-info span {
            color: #888;
            margin-left: 10px;
        }
        
        .task-actions a {
            margin-left: 10px;
            text-decoration: none;
            color: #5cb85c;
            font-weight: bold;
        }
        
        .task-actions a:hover {
            color: #4cae4c;
            text-decoration: underline;
        }
        
        .empty-message {
            text-align: center;
            color: #fff;
            font-size: 18px;
        }
        
        .empty-message a {
            color: #ff6f61;
            font-weight: bold;
        }
        
        .empty-message a:hover {
            text-decoration: underline;
        }
        
        footer {
            margin-top: 30px;
            color: #fff;
            text-align: center;
            font-size: 14px;
        }
        
        footer a {
            color: #5cb85c;
            text-decoration: none;
        }
        
        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <h1>Your To-Do List</h1>
    <div class="nav">
        <a href="{% url 'logout' %}">Logout</a>
        <a href="{% url 'task_create' %}">Add New Task</a>
    </div>
    <ul>
        {% for task in tasks %}
        <li>
            <div class="task-info">
                <strong>{{ task.title }}</strong> - {{ task.description }} {% if task.completed %}<span>(Completed)</span>{% endif %}
            </div>
            <div class="task-actions">
                <a href="{% url 'task_update' task.pk %}">Edit</a>
                <a href="{% url 'task_delete' task.pk %}">Delete</a>
            </div>
        </li>
        {% empty %}
        <p class="empty-message">No tasks yet. Start by <a href="{% url 'task_create' %}">adding one</a>.</p>
        {% endfor %}
    </ul>
    <footer>
        &copy; by Harsh Sharma. Don't claim as your own :)
    </footer>
</body>

</html>
