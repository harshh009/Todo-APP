<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(45deg, #730e05, #ff9c85);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            width: 350px;
            text-align: center;
        }
        
        h1 {
            color: #333;
            font-size: 30px;
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            text-align: left;
            color: #555;
            font-weight: bold;
            margin-top: 10px;
        }
        
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 8px 0 20px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: 0.3s ease-in-out;
        }
        
        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #ff6f61;
            outline: none;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background-color: #ff6f61;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }
        
        button:hover {
            background-color: #ff4d3b;
        }
        
        .error {
            color: #ff4d3b;
            font-size: 16px;
            margin: 10px 0;
        }
        
        .messages {
            list-style-type: none;
            padding: 0;
            color: #333;
            font-size: 16px;
        }
        
        .messages li {
            margin: 5px 0;
        }
        
        .signup-link {
            margin-top: 20px;
            font-size: 16px;
        }
        
        .signup-link a {
            color: #ff6f61;
            text-decoration: none;
            font-weight: bold;
        }
        
        .signup-link a:hover {
            text-decoration: underline;
        }
        
        footer {
            margin-top: 20px;
            color: #c70c0c;
            font-size: 14px;
        }
        
        footer a {
            color: #ff6f61;
            text-decoration: none;
        }
        
        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Login</h1>

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %} {% if messages %}
        <ul class="messages">
            {% for message in messages %}
            <li>{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <label for="username">Username:</label>
            <input type="text" name="username" required placeholder="Enter your username">

            <label for="password">Password:</label>
            <input type="password" name="password" required placeholder="Enter your password">

            <button type="submit">Log In</button>
        </form>

        <div class="signup-link">
            <p>Don't have an account? <a href="/signup/">Sign up here.</a></p>
        </div>

        <footer>
            &copy; by Harsh Sharma. Don't claim as your own :)
        </footer>
    </div>
</body>

</html>
